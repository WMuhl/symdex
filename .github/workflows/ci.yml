name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify a C toolchain is available (tree-sitter native build)
        run: cc --version

      - name: Restore
        run: dotnet restore symdex.sln

      - name: Build
        run: dotnet build symdex.sln --no-restore -c Release

      - name: Test
        run: dotnet test symdex.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
