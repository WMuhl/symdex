name: Feature request
description: Suggest a language, a query, or a change to how the index behaves.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do with the index today, and where it stops short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command, language, or output you want. A short example of input and output helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you have considered solving it, including grep or another tool.
    validations:
      required: false
